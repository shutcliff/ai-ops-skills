# Runs on every pull request and every push to main. Blocking.
# The scrub list is the repository secret SCRUB_NAMES (one name per line),
# so the private names never appear in this public repo.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repo checks (em dashes, promoted set, scrub)
        env:
          SCRUB_NAMES: ${{ secrets.SCRUB_NAMES }}
        run: bash scripts/check-repo.sh
      - name: Shell scripts parse
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Skill self-checks (layers, evals, readiness audit at handover)
        run: |
          set -euo pipefail
          for s in $(python3 -c "import json;print('\n'.join(json.load(open('.claude-plugin/plugin.json'))['skills']))"); do
            if [ -f "$s/scripts/check_layers.py" ] && [ -f "$s/scripts/run_evals.py" ] && [ -f "$s/scripts/audit.py" ]; then
              echo "== $s"
              (cd "$s" && python3 scripts/check_layers.py && python3 scripts/run_evals.py)
              python3 "$s/scripts/audit.py" "$s" --gate handover
            fi
          done
